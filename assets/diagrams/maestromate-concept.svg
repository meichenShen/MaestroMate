<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">以同一部作品连接三个模块</title><desc id="desc">同一部古典音乐作品关联音乐家对话、音乐小剧场与音乐侦探，三个入口不规定使用顺序。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#25354a}.heading{font-size:26px;font-weight:600}.sub{font-size:15px;fill:#637185}.node-title{font-size:21px;font-weight:600}.node-sub{font-size:15px;fill:#526174}.line{fill:none;stroke:#8291a3;stroke-width:2}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8291a3"/></marker></defs><rect width="1000" height="370" rx="18" fill="#f7f9fc"/><text x="36" y="43" class="heading">以作品连接三个模块</text><text x="36" y="72" class="sub">拟议内容结构 · 用户可从任一入口进入</text>
<rect x="350" y="104" width="300" height="76" rx="14" fill="#253c58"/><text x="500" y="137" text-anchor="middle" class="node-title white">同一部古典音乐作品</text><text x="500" y="163" text-anchor="middle" class="node-sub white">共享背景、录音与活动资料</text>
<path d="M500 180V209" class="line"/><path d="M500 209H185V244" class="line" marker-end="url(#arrow)"/><path d="M500 209V244" class="line" marker-end="url(#arrow)"/><path d="M500 209H815V244" class="line" marker-end="url(#arrow)"/>
<rect x="50" y="247" width="270" height="85" rx="13" fill="#e6eef9" stroke="#c1d1e7"/><text x="185" y="282" text-anchor="middle" class="node-title">音乐家对话</text><text x="185" y="309" text-anchor="middle" class="node-sub">人物与作品背景</text>
<rect x="365" y="247" width="270" height="85" rx="13" fill="#e4f1ec" stroke="#bcd9cc"/><text x="500" y="282" text-anchor="middle" class="node-title">音乐小剧场</text><text x="500" y="309" text-anchor="middle" class="node-sub">艺术化欣赏与回听</text>
<rect x="680" y="247" width="270" height="85" rx="13" fill="#fbefdc" stroke="#e6d0aa"/><text x="815" y="282" text-anchor="middle" class="node-title">音乐侦探</text><text x="815" y="309" text-anchor="middle" class="node-sub">声音比较、判断与解释</text></svg>
