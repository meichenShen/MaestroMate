<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc"><title id="title">共享内容与系统职责</title><desc id="desc">共享资料支持作品页面、播放器和对话服务。页面操作播放器，向服务端请求回答；服务端调用可替换的模型。图示为尚未实现的方案。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#25354a}.heading{font-size:26px;font-weight:600}.sub{font-size:15px;fill:#637185}.node-title{font-size:21px;font-weight:600}.node-sub{font-size:15px;fill:#526174}.line{fill:none;stroke:#8291a3;stroke-width:2}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8291a3"/></marker></defs><rect width="1100" height="510" rx="18" fill="#f7f9fc"/><text x="35" y="42" class="heading">共享内容与系统职责</text><text x="35" y="70" class="sub">拟议架构 · 播放与活动可独立于对话服务运行</text>
